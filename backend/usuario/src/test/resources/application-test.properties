# H2 en memoria — sustituye a PostgreSQL durante los tests de integracion
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas desde las entidades (sobreescribe validate del perfil principal)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT — valores de prueba (minimo 64 caracteres para HMAC-SHA256)
jwt.secret=clave-secreta-de-prueba-para-tests-integracion-minimo-64-caracteres-requeridos-ok
jwt.expiration-ms=3600000

# CORS — valor requerido por CorsConfig
allowed.origins=http://localhost:5173
