spring.application.name=proyectos-usuario
server.port=8080

# JPA — Spring Boot NO crea ni modifica tablas (Django es el dueno del schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# LLM (Anthropic) — valores reales en .env
llm.api.key=${LLM_API_KEY:}
llm.api.url=${LLM_API_URL:https://api.anthropic.com/v1/messages}
llm.model=${LLM_MODEL:claude-sonnet-4-6}
