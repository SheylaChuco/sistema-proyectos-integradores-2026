# Config de desarrollo — las variables las carga ProyectosApplication desde ../../.env
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:proyectos_integradores}
spring.datasource.username=${DB_USER:db_admin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:change-me-in-env-min-64-chars-long-key-placeholder-abc}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}
